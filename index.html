<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lindsey Bertin — Portfolio</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      background: #fff;
      color: #111;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 20px;
    }
    h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }
    p {
      color: #444;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      padding: 14px 18px;
      border-radius: 10px;
      text-decoration: none;
      border: 1px solid #111;
      margin-right: 12px;
      font-weight: 500;
    }
    .primary {
      background: #111;
      color: #fff;
    }
    .secondary {
      background: #fff;
      color: #111;
    }
    .meta {
      margin-top: 36px;
      font-size: 14px;
      color: #666;
    }
    .meta a {
      color: #666;
      text-decoration: none;
    }
    .meta a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Lindsey Bertin</h1>
    <p>Research & UX Portfolio</p>

    <a class="btn primary" href="portfolio.pdf" target="_blank" rel="noopener">
      View Portfolio
    </a>

    <a class="btn secondary" href="portfolio.pdf" download>
      Download PDF
    </a>

    <div class="meta">
      <!-- Optional but recommended -->
      <a href="mailto:YOUR_EMAIL">Email</a> ·
      <a href="https://www.linkedin.com/in/YOUR_HANDLE" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </div>
</body>
</html>
